<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proptech Platform</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>
html,body{margin:0;height:100%;font-family:Inter;background:#0b0f14;color:white;}
.dashboard{display:flex;height:100vh;}
.sidebar{width:340px;padding:20px;overflow:auto;border-right:1px solid #222;}
#map{
    width:100%;
    height:100%;
}

.search-box{width:100%;padding:10px;margin-bottom:10px;background:#111;border:1px solid #222;color:white;}

.asset-card{background:#111;border-radius:12px;margin-bottom:12px;cursor:pointer;}
.asset-card.active{border:2px solid #00ffd5;}

.card-img img{width:100%;height:140px;object-fit:cover;}
.card-content{padding:10px;}
.price{color:#00ffd5;}

.nearby-filter{
position:absolute;
top:10px;
right:10px;
z-index:999;
display:flex;
gap:6px;
flex-wrap:wrap;
}
.nearby-filter button{
padding:6px 8px;
border-radius:8px;
background:#111;
color:white;
border:1px solid #333;
cursor:pointer;
}

.contact-section{
    background:#0b0f14;
    padding:60px 20px;
}

.contact{
    background:#111;
    border-radius:16px;
    padding:40px;
    max-width:600px;
    margin:auto;
    text-align:center;
}

.contact h2{
    font-size:26px;
    margin-bottom:10px;
}

.contact input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #333;
    background:#0b0f14;
    color:white;
}

.contact button{
    margin-top:15px;
    padding:12px;
    width:100%;
    border:none;
    border-radius:10px;
    background:#00ffd5;
    font-weight:600;
    cursor:pointer;
}

.topbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:rgba(11,15,20,0.8);
    backdrop-filter: blur(10px);
    border-bottom:1px solid #222;
    z-index:1000;
}

.topbar-inner{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:"Playfair Display", serif;
    font-size:20px;
    font-weight:600;
}

.logo-icon{
    font-size:22px;
}

.logo-text{
    letter-spacing:1px;
}

body{
    padding-top:60px;
}

</style>

</head>

<body>
<div class="topbar">
    <div class="topbar-inner">
        <div class="logo" onclick="location.href='index.html'" style="cursor:pointer;">
            <span class="logo-icon">🏡</span>
            <span class="logo-text">Kha Tran</span>
        </div>
    </div>
</div>

<div class="dashboard">

<div class="sidebar">

<input id="search" class="search-box" placeholder="Search">
<select id="country" class="search-box"></select>
<select id="type" class="search-box"></select>

<input id="price-min" class="search-box" placeholder="Min price">
<input id="price-max" class="search-box" placeholder="Max price">

<input id="rent-min" class="search-box" placeholder="Min rent">
<input id="rent-max" class="search-box" placeholder="Max rent">

<div id="asset-list"></div>

</div>

<div style="position:relative;flex:1;height:100%;">

<div class="nearby-filter">
<button onclick="toggleType('cafe')">☕</button>
<button onclick="toggleType('restaurant')">🍽</button>
<button onclick="toggleType('bank')">🏦</button>
<button onclick="toggleType('supermarket')">🛒</button>
<button onclick="toggleType('school')">🏫</button>
<button onclick="toggleType('hospital')">🏥</button>
<button onclick="toggleType('convenience_store')">🏪</button>
</div>

<div id="map"></div>

</div>

</div>


<div class="contact-section">

    <div class="contact">

        <h2>Need help finding the right property?</h2>
        <p>Leave your info and we will contact you shortly</p>

        <form id="contact-form" 
              action="https://formsubmit.co/quangkhatran@gmail.com" 
              method="POST">

            <input name="name" placeholder="Your name" required>
            <input name="phone" placeholder="Phone number" required>
            <input name="email" placeholder="Email (optional)">

            <!-- hidden -->
            <input type="hidden" name="property" id="property-field">
            <input type="hidden" name="_subject" value="New Lead from Index 🚀">
            <input type="hidden" name="_captcha" value="false">

            <button type="submit">Contact Now</button>

        </form>

        <div id="form-msg"></div>

    </div>

</div>

<script src="data.js"></script>

<script>
let map, markers={}, infoWindow;
let nearbyMarkers=[], nearbyData=[];
let activeTypes=["cafe","restaurant","bank","supermarket","school","hospital","convenience_store"];
let currentProperty=null;

function goToDetail(id){
    window.location.href = `project.html?id=${id}`;
}

function createNearbyMarker(type){
    const icons={
        restaurant:"🍽️",
        cafe:"☕",
        bank:"🏦",
        supermarket:"🛒",
        school:"🏫",
        hospital:"🏥",
        convenience_store:"🏪"
    };
    const div=document.createElement("div");
    div.style.fontSize="18px";
    div.innerHTML=icons[type]||"📍";
    return div;
}

const search = document.getElementById("search");
const country = document.getElementById("country");
const type = document.getElementById("type");
const priceMin = document.getElementById("price-min");
const priceMax = document.getElementById("price-max");
const rentMin = document.getElementById("rent-min");
const rentMax = document.getElementById("rent-max");

function initMap(){
    map=new google.maps.Map(document.getElementById("map"),{
        center:{lat:10.78,lng:106.7},
        zoom:13,
        mapId:"a06f0b68f297368151688ee9"
    });

    infoWindow=new google.maps.InfoWindow();

    initFilters();
    render(assets);

    [search, country, type, priceMin, priceMax, rentMin, rentMax].forEach(el => el.addEventListener("input", applyFilters));

    const first=assets.find(p=>p.lat&&p.lng);
    if(first){
        focusProperty(first.id);
        document.getElementById("property-field").value = first.name;
    }
}

function render(list){
    const el=document.getElementById("asset-list");
    el.innerHTML="";

    Object.values(markers).forEach(m=>m.map = null);
    markers={};

    list.forEach(p=>{

        el.innerHTML+=`
        <div class="asset-card" onclick="focusProperty('${p.id}')">
            <div class="card-img"><img src="${p.images?.[0]||""}"></div>
            <div class="card-content">
                <b>${p.name}</b>
                <p>${p.address||""}</p>
                <p class="price">${p.price} ${p.priceUnit}</p>
            </div>
        </div>`;

        const marker=new google.maps.marker.AdvancedMarkerElement({
            map,
            position:{lat:p.lat,lng:p.lng}
        });

        marker.addListener("click",()=>{
            focusProperty(p.id);
            showPopup(p,marker);
        });

        markers[p.id]=marker;
    });
}

function focusProperty(id){
    const p=assets.find(x=>x.id==id);
    if(!p) return;

    currentProperty=p;

    map.panTo({lat:p.lat,lng:p.lng});
    map.setZoom(15);

    loadNearby(p.lat,p.lng);
    showPopup(p,markers[id]);

    document.getElementById("property-field").value = p.name;
}

function showPopup(p,marker){
    infoWindow.setContent(`
    <div style="color:black;max-width:260px;font-family:Inter">

        ${p.images?.[0] ? `
            <img src="${p.images[0]}" 
                 style="width:100%;height:140px;object-fit:cover;border-radius:10px;margin-bottom:10px;">
            ` : ""}

            <b style="font-size:16px;">${p.name}</b>

            <div style="opacity:0.7;font-size:13px;">
                ${p.type || ""}
            </div>

            <div style="font-size:13px;">
                ${p.address || ""}
            </div>

            <div style="margin-top:6px;color:#16a34a;font-weight:700;">
                ${p.price} ${p.priceUnit}
            </div>

            ${p.rent ? `
            <div style="font-size:13px;color:#00ffd5;">
                ${p.rent} ${p.rentUnit}
            </div>` : ""}

            <div style="margin-top:10px;">
                <a href="project.html?id=${p.id}"
                style="
                    display:block;
                    text-align:center;
                    padding:8px;
                    background:#111;
                    color:white;
                    border-radius:8px;
                    text-decoration:none;
                ">
                View detail →
                </a>
            </div>

        </div>
    `);
    infoWindow.open({map,anchor:marker});
}

function loadNearby(lat,lng){

    nearbyData=[];
    nearbyMarkers.forEach(m=>m.map=null);
    nearbyMarkers=[];

    const service=new google.maps.places.PlacesService(map);

    activeTypes.forEach(type=>{
        service.nearbySearch({
            location:{lat,lng},
            radius:800,
            type
        },(res,status)=>{
            if(status!=="OK") return;

            res.slice(0,3).forEach(p=>{
                p._type=type;
                nearbyData.push(p);
            });

            renderNearby(lat,lng);
        });
    });
}

function renderNearby(lat,lng){

    nearbyMarkers.forEach(m=>m.map=null);
    nearbyMarkers=[];

    nearbyData.forEach(p=>{

        const marker=new google.maps.marker.AdvancedMarkerElement({
            map,
            position:p.geometry.location,
            content:createNearbyMarker(p._type)
        });

        const dist = Math.round(
            google.maps.geometry.spherical.computeDistanceBetween(
                new google.maps.LatLng(lat,lng),
                p.geometry.location
            )
        );

        marker.addListener("click",()=>{
            infoWindow.setContent(`
                <div style="color:black;max-width:240px;font-family:Inter">

                    ${p.photos?.[0] ? `
                    <img src="${p.photos[0].getUrl({maxWidth:300})}" 
                         style="width:100%;height:140px;object-fit:cover;border-radius:10px;margin-bottom:8px;">
                    ` : ""}

                    <b style="font-size:15px;">${p.name}</b>

                    <div style="font-size:13px;opacity:0.7;margin-bottom:6px;">
                        ⭐ ${p.rating || "-"} • ${p._type}
                    </div>

                    <div style="font-size:13px;">
                        📍 ${dist} m away
                    </div>

                    <div style="margin-top:10px;">
                        <a target="_blank"
                        href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}"
                        style="
                            display:block;
                            text-align:center;
                            padding:6px;
                            background:#111;
                            color:white;
                            border-radius:8px;
                            text-decoration:none;
                        ">
                        View on Maps →
                        </a>
                    </div>

                </div>
            `);
            infoWindow.open({map,anchor:marker});
        });

        nearbyMarkers.push(marker);
    });
}

function toggleType(t){
    activeTypes.includes(t)
    ? activeTypes = activeTypes.filter(x=>x!==t)
    : activeTypes.push(t);

    // highlight UI
    document.querySelectorAll(".nearby-filter button")
    .forEach(btn=>{
        const type = btn.innerText;
    });

    loadNearby(currentProperty.lat,currentProperty.lng);
}

function initFilters(){

    const countries = [...new Set(assets.map(p=>p.country).filter(Boolean))];
    const types = [...new Set(assets.map(p=>p.type).filter(Boolean))];

    country.innerHTML = `<option value="">All Countries</option>` +
        countries.map(c=>`<option value="${c}">${c}</option>`).join("");

    type.innerHTML = `<option value="">All Types</option>` +
        types.map(t=>`<option value="${t}">${t}</option>`).join("");

}

function applyFilters(){

    let list = [...assets];

    const keyword = search.value.toLowerCase();
    const c = country.value;
    const t = type.value;

    if(keyword){
        list = list.filter(p =>
            p.name.toLowerCase().includes(keyword) ||
            (p.address||"").toLowerCase().includes(keyword)
        );
    }

    if(c){
        list = list.filter(p => p.country === c);
    }

    if(t){
        list = list.filter(p => 
            (p.type || "").toLowerCase() === t.toLowerCase()
        );
    }

    const minP = parseFloat(priceMin.value);
    const maxP = parseFloat(priceMax.value);

    if(!isNaN(minP)) list = list.filter(p => p.price >= minP);
    if(!isNaN(maxP)) list = list.filter(p => p.price <= maxP);

    const minR = parseFloat(rentMin.value);
    const maxR = parseFloat(rentMax.value);

    if(!isNaN(minR)) list = list.filter(p => p.rent >= minR);
    if(!isNaN(maxR)) list = list.filter(p => p.rent <= maxR);

    render(list);
    if(list.length){
        focusProperty(list[0].id);
    }
}


</script>
<script>
    const form = document.getElementById("contact-form");
    const msg = document.getElementById("form-msg");

    form.addEventListener("submit", ()=>{
        msg.innerHTML = "Sending...";
        msg.style.color = "#00ffd5";
    });
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCdiUVAybjsQqysEAZOzsNlBesXU0bII-8&libraries=places,marker,geometry&callback=initMap" async defer></script>

</body>
</html>
