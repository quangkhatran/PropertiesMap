<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proptech Platform</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>
html,body{
    height:100%;
    margin:0;
    font-family:Inter;
    background:#0b0f14;
    color:white;
}

.navbar{
    display:flex;
    justify-content:space-between;
    padding:0 40px;
}

.logo{
    font-family:'Playfair Display';
    font-size:20px;
    line-height:60px;
    color:white;
}

.dashboard{
    display:flex;
    height:calc(100vh - 60px);
}

.sidebar{
    width:320px;
    padding:20px;
    overflow:auto;
    border-right:1px solid #222;
}

#map{
    flex:1;
}

/* UI */
.search-box{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    background:#111;
    border:1px solid #222;
    color:white;
}

.asset-card{
    background:#111;
    border-radius:12px;
    margin-bottom:12px;
    cursor:pointer;
}

.asset-card:hover{
    border:1px solid #00ffd5;
}

.card-img img{
    width:100%;
    height:140px;
    object-fit:cover;
}

.card-content{padding:10px;}
.price{color:#00ffd5;}

.place-card{
    background:#111;
    padding:10px;
    margin-top:8px;
    border-radius:10px;
}
</style>

</head>

<body>

<div class="navbar">
    <div class="logo">KHA TRAN</div>
</div>

<div class="dashboard">

<div class="sidebar">

<input id="search" class="search-box" placeholder="Search">
<input id="price-min" class="search-box" placeholder="Min price">
<input id="price-max" class="search-box" placeholder="Max price">

<div id="asset-list"></div>

<h3>Nearby</h3>
<div id="nearby-list"></div>

</div>

<div id="map"></div>

</div>

<script src="data.js"></script>

<script>
let map;
let markers = [];

// ✅ FIX: khai báo đầy đủ biến
const search = document.getElementById("search");
const priceMin = document.getElementById("price-min");
const priceMax = document.getElementById("price-max");

function initMap(){
    map = new google.maps.Map(document.getElementById("map"), {
        center: { lat:10.78, lng:106.7 },
        zoom:13,
        styles:[
            {elementType:"geometry",stylers:[{color:"#0b0f14"}]},
            {elementType:"labels.text.fill",stylers:[{color:"#ffffff"}]}
        ]
    });

    render(assets);
}

/* RENDER */
function render(list){

    const el = document.getElementById("asset-list");
    el.innerHTML="";

    markers.forEach(m=>m.setMap(null));
    markers=[];

    list.forEach(p=>{

        el.innerHTML+=`
        <div class="asset-card" onclick="goDetail('${p.id}')">
            <div class="card-img">
                <img src="${p.images?.[0]}">
            </div>
            <div class="card-content">
                <b>${p.name}</b>
                <p>${p.address||""}</p>
                <p class="price">$${p.price||""}</p>
            </div>
        </div>
        `;

        const marker = new google.maps.Marker({
            position:{lat:p.lat,lng:p.lng},
            map:map
        });

        marker.addListener("click",()=>{
            map.setCenter({lat:p.lat,lng:p.lng});
            map.setZoom(15);
            loadNearby(p.lat,p.lng);
        });

        markers.push(marker);
    });
}

/* FILTER */
function filter(){
    const keyword = search.value.toLowerCase();
    const min = +priceMin.value || 0;
    const max = +priceMax.value || 999999999;

    const filtered = assets.filter(p=>{
        return p.name.toLowerCase().includes(keyword)
        && p.price >= min
        && p.price <= max;
    });

    render(filtered);
}

// ✅ bind event sau khi đã khai báo biến
search.oninput = filter;
priceMin.oninput = filter;
priceMax.oninput = filter;

/* NEARBY */
async function loadNearby(lat,lng){

    const box=document.getElementById("nearby-list");
    box.innerHTML="Loading...";

    try{
        const res = await fetch(`https://propertiesmap.onrender.com/api/nearby?lat=${lat}&lng=${lng}`);
        const data = await res.json();

        box.innerHTML="";

        data.results.slice(0,8).forEach(p=>{
            box.innerHTML+=`
            <div class="place-card">${p.name}</div>
            `;
        });

    }catch(e){
        box.innerHTML="Failed to load";
    }
}

function goDetail(id){
    window.location.href=`project.html?id=${id}`;
}
</script>

<!-- ⚠️ nhớ thay API KEY -->

<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>

</body>
</html>
