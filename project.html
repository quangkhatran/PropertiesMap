<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Project Detail</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Inter;background:#0b0f14;color:white;}

.back-btn{
position:fixed;top:20px;left:20px;z-index:999;
background:rgba(255,255,255,0.9);color:#111;
border:none;padding:10px 16px;border-radius:10px;
font-weight:600;cursor:pointer;
backdrop-filter: blur(10px);
box-shadow:0 6px 20px rgba(0,0,0,0.3);
}

.hero{
height:60vh;background-size:cover;background-position:center;
display:flex;align-items:end;padding:40px;position:relative;
}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.7), transparent);}
.hero-content{position:relative;z-index:2;}
.hero-price{font-size:28px;font-weight:700;color:#00ffd5;}

.section{padding:40px;max-width:1100px;margin:auto;}

#info{background:#111;padding:24px;border-radius:16px;}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.gallery img{width:100%;height:200px;object-fit:cover;border-radius:12px;}

#map{width:100%;height:420px;border-radius:16px;}

.nearby-filter{display:flex;gap:8px;margin:10px 40px;flex-wrap:wrap;}
.nearby-filter button{
padding:6px 10px;border-radius:8px;background:#111;color:white;border:1px solid #333;cursor:pointer;
}
.nearby-filter button.active{background:#00ffd5;color:#000;}

.cta{background:#111;padding:30px;border-radius:16px;text-align:center;margin:40px auto;max-width:500px;}
.cta input{width:100%;padding:10px;margin-top:10px;border-radius:8px;border:1px solid #333;background:#0b0f14;color:white;}
.cta button{margin-top:10px;padding:12px;background:#00ffd5;border:none;border-radius:10px;font-weight:600;cursor:pointer;}

.contact{
    background:#111;
    border-radius:16px;
    padding:40px;
    max-width:600px;
    margin:60px auto;
    text-align:center;
}

.contact input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #333;
    background:#0b0f14;
    color:white;
}

.contact button{
    margin-top:15px;
    padding:12px;
    width:100%;
    border:none;
    border-radius:10px;
    background:#00ffd5;
    font-weight:600;
    cursor:pointer;
}

.topbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:rgba(11,15,20,0.8);
    backdrop-filter: blur(10px);
    border-bottom:1px solid #222;
    z-index:1000;
}

.topbar-inner{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:"Playfair Display", serif;
    font-size:20px;
    font-weight:600;
}

.logo-icon{
    font-size:22px;
}

.logo-text{
    letter-spacing:1px;
}

body{
    padding-top:60px;
}
</style>

</head>

<body>
<div class="topbar">
    <div class="topbar-inner">
        <div class="logo" onclick="location.href='index.html'" style="cursor:pointer;">
            <span class="logo-icon">🏡</span>
            <span class="logo-text">Kha Tran</span>
        </div>
    </div>
</div>

<button class="back-btn" onclick="goBack()">← Back</button>

<div id="project"></div>

<div class="section">
<h3>Information</h3>
<div id="info"></div>
</div>

<div class="section">
<h3>Map</h3>

<div class="nearby-filter">
<button onclick="toggleType('cafe')">☕</button>
<button onclick="toggleType('restaurant')">🍽</button>
<button onclick="toggleType('bank')">🏦</button>
<button onclick="toggleType('supermarket')">🛒</button>
<button onclick="toggleType('school')">🏫</button>
<button onclick="toggleType('hospital')">🏥</button>
<button onclick="toggleType('convenience_store')">🏪</button>
</div>

<div id="map"></div>
</div>

<div class="section">
<h3>Gallery</h3>
<div class="gallery" id="gallery"></div>
</div>

<script src="data.js"></script>

<script>
const id=new URLSearchParams(location.search).get("id");
const project=assets.find(p=>String(p.id)===id);

let map, infoWindow;
let nearbyData=[];
let nearbyMarkers=[];
let activeTypes=["cafe","restaurant","bank","supermarket","school","hospital","convenience_store"];

function render(){
document.getElementById("project").innerHTML=`
<div class="hero" style="background-image:url('${project.images?.[0]||""}')">
<div class="hero-content">
<h1>${project.name}</h1>
<div class="hero-price">${project.price} ${project.priceUnit}</div>
<div>${project.address}</div>
</div>
</div>`;

document.getElementById("info").innerHTML=`
<div class="info-grid">
<div>${project.type}</div>
<div>${project.address}</div>
<div class="price">${project.price} ${project.priceUnit}</div>
</div>
<div style="margin-top:10px;">${project.description||""}</div>`;

document.getElementById("gallery").innerHTML=
project.images.map(i=>`<img src="${i}">`).join("");

document.getElementById("property-field").value = project.name;
}

function initMap(){
render();

const center={lat:project.lat,lng:project.lng};

map=new google.maps.Map(document.getElementById("map"),{
center,zoom:15,mapId:"properties-map"
});

infoWindow=new google.maps.InfoWindow();

// 🔥 PROPERTY MARKER
const mainMarker=new google.maps.marker.AdvancedMarkerElement({
map,position:center
});

// 🔥 PROPERTY POPUP (FULL)
infoWindow.setContent(`
<div style="color:black;max-width:260px;font-family:Inter">

${project.images?.[0]?`
<img src="${project.images[0]}" style="width:100%;height:140px;object-fit:cover;border-radius:10px;margin-bottom:10px;">
`:``}

<b>${project.name}</b>

<div style="opacity:0.7;font-size:13px;">
${project.type}
</div>

<div style="font-size:13px;">
${project.address}
</div>

<div style="margin-top:6px;color:#16a34a;font-weight:700;">
${project.price} ${project.priceUnit}
</div>

</div>
`);

infoWindow.open({map,anchor:mainMarker});

loadNearby(center);
}

// 🔥 ICON MARKER
function createNearbyMarker(type){
const icons={
restaurant:"🍽️",
cafe:"☕",
bank:"🏦",
supermarket:"🛒",
school:"🏫",
hospital:"🏥",
convenience_store:"🏪"
};
const div=document.createElement("div");
div.style.fontSize="18px";
div.innerHTML=icons[type]||"📍";
return div;
}

// 🔥 LOAD NEARBY
function loadNearby(center){
const service=new google.maps.places.PlacesService(map);

["cafe","restaurant","bank","supermarket","school","hospital","convenience_store"]
.forEach(type=>{
service.nearbySearch({
location:center,radius:800,type
},(res,status)=>{
if(status!=="OK")return;

res.slice(0,3).forEach(p=>{
p._type=type;
nearbyData.push(p);
});

renderNearby();
});
});
}

// 🔥 RENDER NEARBY (FIXED)
function renderNearby(){

nearbyMarkers.forEach(m=>m.map=null);
nearbyMarkers=[];

nearbyData
.filter(p=>activeTypes.includes(p._type))
.forEach(p=>{

const marker=new google.maps.marker.AdvancedMarkerElement({
map,
position:p.geometry.location,
content:createNearbyMarker(p._type)
});

const dist=Math.round(
google.maps.geometry.spherical.computeDistanceBetween(
new google.maps.LatLng(project.lat,project.lng),
p.geometry.location
)
);

// 🔥 POPUP XỊN
marker.addListener("click",()=>{
infoWindow.setContent(`
<div style="color:black;max-width:240px;font-family:Inter">

${p.photos?.[0]?`
<img src="${p.photos[0].getUrl({maxWidth:300})}" 
style="width:100%;height:140px;object-fit:cover;border-radius:10px;margin-bottom:8px;">
`:``}

<b style="font-size:15px;">${p.name}</b>

<div style="font-size:13px;opacity:0.7;margin-bottom:6px;">
⭐ ${p.rating||"-"} • ${p._type}
</div>

<div style="font-size:13px;">
📍 ${dist} m away
</div>

<div style="margin-top:10px;">
<a target="_blank"
href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}"
style="display:block;text-align:center;padding:6px;background:#111;color:white;border-radius:8px;text-decoration:none;">
View on Maps →
</a>
</div>

</div>
`);
infoWindow.open({map,anchor:marker});
});

nearbyMarkers.push(marker);

});
}

function toggleType(t){
activeTypes.includes(t)
? activeTypes=activeTypes.filter(x=>x!==t)
: activeTypes.push(t);
renderNearby();
}

function goBack(){location.href="index.html";}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCdiUVAybjsQqysEAZOzsNlBesXU0bII-8&libraries=places,marker,geometry&callback=initMap" async defer></script>

<div class="section contact">

    <h2>Contact us</h2>
    <p>Leave your info and we will contact you shortly</p>

    <form id="contact-form" 
          action="https://formsubmit.co/quangkhatran@gmail.com" 
          method="POST">

        <input name="name" placeholder="Your name" required>
        <input name="phone" placeholder="Phone number" required>
        <input name="email" placeholder="Email (optional)">

        <!-- hidden -->
        <input type="hidden" name="property" id="property-field">
        <input type="hidden" name="_subject" value="New Lead 🚀">
        <input type="hidden" name="_captcha" value="false">

        <button type="submit">Contact Now</button>

    </form>

    <div id="form-msg"></div>

</div>

<script>
	const form = document.getElementById("contact-form");
	const msg = document.getElementById("form-msg");

	form.addEventListener("submit", ()=>{
	    msg.innerHTML = "Sending...";
	    msg.style.color = "#00ffd5";
	});
</script>
</body>
</html>
