<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Compare Markets | Kha Tran</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">


  <style>
    body{
  background:#070b11;
  color:white;
  font-family:Inter, Arial, sans-serif;
  margin:0;
  padding:0;
}

    h1{
      font-size:56px;
      font-family:serif;
    }

    .controls{
      margin:40px 0;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    button, select{
      padding:14px 18px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.1);
      background:#101826;
      color:white;
    }

    button{
      background:#42f5d7;
      color:#041018;
      font-weight:700;
      cursor:pointer;
      border:none;
      padding:15px 28px;
      border-radius:16px;
      transition:0.25s ease;
    }

    button:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 25px rgba(66,245,215,0.28);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:20px;
      margin-top:30px;
    }

    .card{
      background:#0b1220;
      border:1px solid rgba(255,255,255,0.06);
      border-radius:24px;
      padding:26px;
    }

    .score{
      font-size:54px;
      color:#00ffd5;
      font-weight:700;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:30px;
      background:#0b1220;
      border-radius:20px;
      overflow:hidden;
    }

    th,td{
      padding:16px;
      border-bottom:1px solid rgba(255,255,255,0.06);
      text-align:left;
    }

    th{
      color:#00ffd5;
    }

    .navbar {
    position:fixed;
    top:0;
    left:0;
    right:0;

    height:70px;

    display:flex;
    justify-content:flex-start;
    align-items:center;

    padding:0 40px;

    background:rgba(10,15,20,0.6);
    backdrop-filter:blur(12px);

    border-bottom:1px solid #222;

    box-sizing:border-box;
    
    z-index: 9999;
}

.nav-left {
    display:flex;
    align-items:center;
    gap:30px;
}

.logo {
    font-family:'Playfair Display';
    font-size:20px;
    letter-spacing:2px;
    color:white;
    text-decoration:none;
}

.nav-link {
    font-family:'Playfair Display';
    font-size:15px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#ccc;
    text-decoration:none;
}

.nav-link:hover {
    color:#00ffd5;
}

.nav-link.active {
    color:#00ffd5;
}

@media(max-width:768px){
    .navbar {
        padding:0 20px;
    }

    .nav-left {
        gap:12px;
        flex-wrap:wrap;
    }

    .nav-link {
        font-size:11px;
    }
}

.nav-right{
    margin-left:auto;
}

.compare-hero {
  position: relative;
  height: 74vh;
  min-height: 680px;

  background:
    linear-gradient(
      to bottom,
      rgba(5,10,18,0.58),
      rgba(5,10,18,0.82)
    ),
    url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2200&auto=format&fit=crop');

  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
}

.compare-overlay {
  position: absolute;
  inset: 0;
  backdrop-filter: blur(1px);
}

.compare-hero-content {
  position: relative;
  z-index: 2;

  max-width: 1100px;

  margin: 0 auto;

  padding: 0 40px;

  text-align: center;
}

.hero-label {
  color: #20f0d0;
  letter-spacing: 4px;
  font-size: 13px;
  text-transform: uppercase;
  margin-bottom: 18px;
  font-weight: 600;
}

.compare-hero h1 {
  text-shadow: 0 10px 40px rgba(0,0,0,0.35);
  font-family: 'Playfair Display', serif;
  font-size: 82px;
  line-height: 0.95;
  color: white;
  margin-bottom: 24px;
}

.compare-hero p {
  font-size: 22px;
  line-height: 1.7;
  color: rgba(255,255,255,0.82);

  max-width: 820px;

  margin: 0 auto;
}

.compare-content{
  position:relative;
  z-index:5;
  max-width:1400px;
  margin:48px auto 0 auto;
  padding:0 5vw 120px;
}

.hero-controls{
  margin:42px auto 0 auto;
  max-width:1200px;

  background:rgba(10,18,30,0.72);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:28px;
  padding:22px 24px;

  display:flex;
  gap:18px;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;

  backdrop-filter:blur(20px);
  box-shadow:0 18px 60px rgba(0,0,0,0.34);
}

.controls label{
  display:flex;
  align-items:center;
  gap:8px;
  color:#e5e7eb;
  font-weight:600;
}

.card,
table{
  box-shadow:0 20px 70px rgba(0,0,0,0.28);
}

@media(max-width:768px){
  .compare-hero{
    min-height:760px;
  }

  .compare-hero-content{
    padding:0 24px;
  }

  .compare-hero h1{
    font-size:48px;
  }

  .compare-hero p{
    font-size:17px;
  }

  .compare-content{
    margin:36px auto 0 auto;
    padding:0 20px 90px;
  }

  .hero-controls{
    margin-top:28px;
    padding:18px;
    border-radius:22px;
  }
}

/* =========================
LIQUID GLASS COMPARE INPUTS
========================= */

.hero-controls{
  margin:42px auto 0 auto;
  max-width:1200px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,0.13),
      rgba(255,255,255,0.045)
    );

  border:
    1px solid rgba(255,255,255,0.18);

  border-radius:28px;

  padding:16px;

  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.22),
    inset 0 -1px 0 rgba(255,255,255,0.04),
    0 24px 80px rgba(0,0,0,0.38);
}

.hero-controls select{
  width:180px;
  height:58px;

  padding:0 18px;

  border:
    1px solid rgba(255,255,255,0.20);

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,0.16),
      rgba(255,255,255,0.06)
    );

  color:white;

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  outline:none;
  cursor:pointer;

  font-size:14px;
  font-weight:600;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.18),
    0 10px 28px rgba(0,0,0,0.18);

  appearance:none;
  -webkit-appearance:none;
}

.hero-controls select option{
  background:#101826;
  color:white;
}

.hero-controls label{
  height:58px;

  display:flex;
  align-items:center;
  gap:9px;

  padding:0 15px;

  border:
    1px solid rgba(255,255,255,0.14);

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,0.12),
      rgba(255,255,255,0.045)
    );

  color:white;

  font-weight:600;
  font-size:14px;

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.16),
    0 10px 26px rgba(0,0,0,0.16);

  transition:0.25s ease;
}

.hero-controls label:hover,
.hero-controls select:hover{
  border-color:rgba(0,255,213,0.36);

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,0.18),
      rgba(255,255,255,0.07)
    );

  transform:translateY(-1px);
}

.hero-controls input[type="checkbox"]{
  width:15px;
  height:15px;
  accent-color:#00ffd5;
}

.hero-controls button{
  height:58px;

  padding:0 32px;

  border:none;
  border-radius:18px;

  background:#00ffd5;
  color:#041018;

  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 12px 34px rgba(0,255,213,0.25),
    inset 0 1px 0 rgba(255,255,255,0.45);

  transition:0.25s ease;
}

.hero-controls button:hover{
  transform:translateY(-2px);

  box-shadow:
    0 18px 44px rgba(0,255,213,0.34),
    inset 0 1px 0 rgba(255,255,255,0.50);
}

/* Keep old dashboard controls from overriding liquid glass */
.controls.hero-controls{
  margin-top:42px;
}

@media(max-width:768px){

  .hero-controls{
    margin-top:28px;
    padding:14px;
    border-radius:24px;
    gap:10px;
  }

  .hero-controls select,
  .hero-controls button{
    width:100%;
  }

  .hero-controls label{
    width:100%;
    justify-content:center;
  }

}

  </style>
</head>

<body>
  <div class="navbar">
  <div class="nav-left">
    <a href="index.html" class="logo">KHA TRAN</a>

    <a href="index.html#home" class="nav-link">Home</a>
    <a href="lifestyle.html" class="nav-link">Lifestyle</a>
    <a href="real-estate.html" class="nav-link">Real Estate</a>
    <a href="compare.html" class="nav-link active">Compare</a>
    <a href="contact.html" class="nav-link">Contact</a>
  </div>
</div>  

  <section class="compare-hero">
    <div class="compare-overlay"></div>

    <div class="compare-hero-content">
      <p class="hero-label">AI MARKET COMPARISON</p>

      <h1>Cross-Market Intelligence</h1>

      <p>
        Compare infrastructure, liquidity, institutional quality
        and speculative heat across emerging markets.
      </p>

  <div class="controls hero-controls">

    <select id="category">
      <option value="land">Land</option>
      <option value="house">House / Apartment</option>
      <option value="commercial">Commercial</option>
      <option value="luxury">Luxury</option>
      <option value="industrial">Industrial</option>
    </select>

    <label>
      <input type="checkbox" value="Dong Nai" checked>
      Dong Nai
    </label>

    <label>
      <input type="checkbox" value="Nhon Trach" checked>
      Nhon Trach
    </label>

    <label>
      <input type="checkbox" value="Long Thanh" checked>
      Long Thanh
    </label>

    <label>
      <input type="checkbox" value="Binh Duong">
      Binh Duong
    </label>

    <label>
      <input type="checkbox" value="Long An">
      Long An
    </label>

    <button onclick="compareMarkets()">
      Compare
    </button>

  </div>
    </div>
  </section>
<div class="compare-content">


  <div id="summary" class="grid"></div>

  <div id="table"></div>
</div>
<script>

async function compareMarkets(){

  const cities =
    [...document.querySelectorAll('input[type="checkbox"]:checked')]
      .map(input => input.value);

  const category =
    document.getElementById('category').value;

  const response =
    await fetch('/compare-markets', {
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        cities,
        category
      })
    });

  const data =
    await response.json();

  renderComparison(
    data.comparison
  );
}

function renderComparison(comparison){

  const summary =
    comparison.summary;

  document.getElementById('summary').innerHTML = `

    <div class="card">
      <div>Top Market</div>
      <h2>${summary.topMarket}</h2>
    </div>

    <div class="card">
      <div>Average Score</div>
      <div class="score">${summary.averageScore}/10</div>
    </div>

    <div class="card">
      <div>Strongest Infrastructure</div>
      <h2>${summary.strongestInfrastructure}</h2>
    </div>

    <div class="card">
      <div>Best Liquidity</div>
      <h2>${summary.bestLiquidity}</h2>
    </div>

    <div class="card">
      <div>Highest Speculation</div>
      <h2>${summary.highestSpeculation}</h2>
    </div>

  `;

  document.getElementById('table').innerHTML = `

    <table>
      <thead>
        <tr>
          <th>Market</th>
          <th>Score</th>
          <th>Infrastructure</th>
          <th>Momentum</th>
          <th>Speculation</th>
          <th>Liquidity</th>
          <th>Maturity</th>
          <th>Population</th>
          <th>GRDP</th>
          <th>Tourism</th>
        </tr>
      </thead>

      <tbody>
        ${comparison.markets.map(m => `
          <tr>
            <td>${m.city}</td>
            <td>${m.investmentScore}/10</td>
            <td>${m.infrastructure}/10</td>
            <td>${m.investmentMomentum}/10</td>
            <td>${m.speculativeHeat}/10</td>
            <td>${m.liquidity}/10</td>
            <td>${m.marketMaturity}/10</td>
            <td>${m.populationScale}/10</td>
            <td>${m.grdpStrength}/10</td>
            <td>${m.tourismDemand}/10</td>
          </tr>
        `).join('')}
      </tbody>
    </table>

  `;
}

compareMarkets();

</script>

</body>
</html>
