<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<script type="module" src="admin.js"></script>

<style>
body{
    margin:0;
    font-family: Inter, sans-serif;
    background:#0b0f14;
    color:white;
}

.layout{
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:240px;
    background:#0f141a;
    padding:20px;
    border-right:1px solid #222;
}

.sidebar h2{
    margin-bottom:20px;
}

.sidebar button{
    width:100%;
    margin-top:10px;
    padding:12px;
    background:#111;
    border:none;
    color:white;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
}

.sidebar button:hover{
    background:#2563eb;
}

/* MAIN */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.topbar{
    padding:20px;
    border-bottom:1px solid #222;
    display:flex;
    justify-content:space-between;
}

/* STATS */
.stats{
    display:flex;
    gap:20px;
    padding:20px;
}

.stat{
    background:#111;
    padding:15px 20px;
    border-radius:12px;
}

/* USERS */
.view{
    padding:20px;
    overflow:auto;
}

.card{
    background:#111;
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
    border:1px solid #222;
    transition:0.2s;
}

.card:hover{
    border:1px solid #444;
}

/* BADGES */
.badge{
    padding:4px 8px;
    border-radius:6px;
    font-size:12px;
}

.role-admin{background:purple;}
.role-vip{background:gold;color:black;}
.role-user{background:#444;}

.status-approved{background:green;}
.status-pending{background:orange;}

/* BUTTONS */
.actions{
    margin-top:10px;
    display:flex;
    gap:8px;
}

.btn{
    padding:6px 10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
}

.btn-approve{background:#16a34a;}
.btn-vip{background:gold;color:black;}
.btn-admin{background:purple;}
.btn-user{background:#555;}
.btn-delete{background:red;}

.btn:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

/* SEARCH */
#search{
    margin:20px;
    padding:10px;
    width:300px;
    border-radius:8px;
    border:1px solid #333;
    background:#111;
    color:white;
}

/* TOAST */
.toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#111;
    padding:12px 16px;
    border-radius:10px;
    border:1px solid #333;
}

</style>
</head>

<body>

<div class="layout">

<aside class="sidebar">
    <h2>👑 Admin</h2>
    <button onclick="navigate('users')">Users</button>
    <button onclick="logout()">Logout</button>
</aside>

<main class="main">

    <div class="topbar">
        <h1>Users</h1>
        <span id="admin-info"></span>
    </div>

    <div class="stats">
        <div class="stat" id="total-users">Total: 0</div>
        <div class="stat" id="pending-users">Pending: 0</div>
    </div>

    <input id="search" placeholder="Search user...">

    <div id="view-users" class="view"></div>

</main>

</div>

</body>
</html>
