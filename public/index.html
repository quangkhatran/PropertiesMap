    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

<script src="data.js"></script>

<script>

function debounce(fn, delay = 800){

    let timeout;

    return (...args)=>{

        clearTimeout(timeout);

        timeout = setTimeout(()=>{
            fn(...args);
        }, delay);

    };

}

let map, markers={}, infoWindow;
let nearbyMarkers=[], nearbyData=[];

let activeTypes=[
    "cafe",
    "restaurant",
    "bank",
    "supermarket",
    "school",
    "hospital",
    "convenience_store"
];

let currentProperty=null;

function goToDetail(id){
    window.location.href = `project.html?id=${id}`;
}

function createNearbyMarker(type){
    const icons={
        restaurant:"🍽️",
        cafe:"☕",
        bank:"🏦",
        supermarket:"🛒",
        school:"🏫",
        hospital:"🏥",
        convenience_store:"🏪"
    };
    const div=document.createElement("div");
    div.style.fontSize="18px";
    div.innerHTML=icons[type]||"📍";
    return div;
}

const search = document.getElementById("search");
const country = document.getElementById("country");
const city = document.getElementById("city");
const type = document.getElementById("type");
const priceMin = document.getElementById("price-min");
const priceMax = document.getElementById("price-max");
const rentMin = document.getElementById("rent-min");
const rentMax = document.getElementById("rent-max");

let nearbyLoadedFor = null;

function initMap(){
    
    map = new google.maps.Map(document.getElementById("map"),{
        center:{lat:10.78,lng:106.7},
        zoom:13,
        mapId:"a06f0b68f297368151688ee9"
    });

    infoWindow=new google.maps.InfoWindow();

    map.addListener("idle", ()=>{

        if(!currentProperty) return;

        const key =
        `${currentProperty.lat}-${currentProperty.lng}`;

        if(nearbyLoadedFor === key){
            return;
        }

        nearbyLoadedFor = key;

        loadNearby(
            currentProperty.lat,
            currentProperty.lng
        );

    });

    initFilters();

    render(window.assets);

    const debouncedApplyFilters =
        debounce(applyFilters, 800);

    [
        search,
        city,
        type,
        priceMin,
        priceMax,
        rentMin,
        rentMax
    ].forEach(el =>

        el.addEventListener(
            "input",
            debouncedApplyFilters
        )

    );

    country.addEventListener("change", ()=>{
        city.value = "";        // 🔥 RESET CITY TRƯỚC
        updateCityOptions();   // 🔥 update city theo country
        applyFilters();        // 🔥 filter lại list
    });

    const first=assets.find(p=>p.lat&&p.lng);
    if(first){
        focusProperty(first.id);
        document.getElementById("property-field").value = first.name;
    }
}

function canViewPrice(){
    return window.isLoggedIn &&
           (
             window.userRole === "admin" ||
             (window.userStatus === "approved" && window.userRole === "vip")
           );
}

function render(list){
    const el=document.getElementById("asset-list");
    el.innerHTML="";

    Object.values(markers).forEach(m=>m.map = null);
    markers={};

    list.forEach(p=>{

        el.innerHTML+=`
            <div class="asset-card" id="card-${p.id}" onclick="focusProperty('${p.id}')">
                <div class="card-img"><img src="${p.images?.[0]||""}"></div>

                <div class="card-content">

                    <b>${p.name}</b>

                    <p>${p.address||""}</p>

                    <p class="price">
                        ${canViewPrice() ? `Price: ${p.price} ${p.priceUnit}` : `🔒 Private listing`}
                    </p>

                    ${p.rent ? `
                    <p style="color:#00ffd5;font-size:13px;">
                        ${canViewPrice() ? `Rent: ${p.rent} ${p.rentUnit}` : `🔒 Private listing`}
                    </p>` : ""}

                    <a href="project.html?id=${p.id}" 
                       onclick="event.stopPropagation()"
                       style="
                            display:block;
                            margin-top:8px;
                            padding:8px;
                            text-align:center;
                            background:#222;
                            color:white;
                            border-radius:8px;
                            text-decoration:none;
                            font-size:13px;
                       ">
                       View detail →
                    </a>

                </div>
            </div>
        `;

        const marker=new google.maps.marker.AdvancedMarkerElement({
            map,
            position:{lat:p.lat,lng:p.lng}
        });

        marker.addListener("click",()=>{
            focusProperty(p.id);
            showPopup(p,marker);
            setActive(p.id);
        });

        markers[p.id]=marker;
    });
}

function focusProperty(id){
    const p=assets.find(x=>x.id==id);
    if(!p) return;

    currentProperty=p;

    map.panTo({lat:p.lat,lng:p.lng});
    map.setZoom(15);

    // loadNearby(p.lat,p.lng);
    showPopup(p,markers[id]);

    document.getElementById("property-field").value = p.name;
    setActive(id);
}

function setActive(id){

    // remove active tất cả card
    document.querySelectorAll(".asset-card")
    .forEach(c => c.classList.remove("active"));

    // add active card hiện tại
    const card = document.getElementById("card-"+id);
    if(card){
        card.classList.add("active");

        // scroll tới card
        card.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });
    }

    // reset marker style
    Object.values(markers).forEach(m=>{
        if(m.content){
            m.content.style.transform = "scale(1)";
        }
    });

    // highlight marker hiện tại
    const marker = markers[id];
    if(marker && marker.content){
        marker.content.style.transform = "scale(1.4)";
    }
}

function showPopup(p,marker){
    infoWindow.setContent(`
    <div style="color:black;max-width:260px;font-family:Inter">

        ${p.images?.[0] ? `
            <img src="${p.images[0]}" 
                 style="width:100%;height:140px;object-fit:cover;border-radius:10px;margin-bottom:10px;">
            ` : ""}

            <b style="font-size:16px;">${p.name}</b>

            <div style="opacity:0.7;font-size:13px;">
                ${p.type || ""}
            </div>

            <div style="font-size:13px;">
                ${p.address || ""}
            </div>

            <div style="margin-top:6px;font-size:13px;font-weight:bold;color:#00ffd5;">
                ${canViewPrice() ? `Price: ${p.price} ${p.priceUnit}` : `🔒 Private listing`}
            </div>

            ${p.rent ? `
            <div style="margin-top:6px;font-size:13px;color:#00ffd5;">
                ${canViewPrice() ? `Rent: ${p.rent} ${p.rentUnit}` : `🔒 Private listing`}
            </div>` : ""}

            <div style="margin-top:12px;">
                <a href="project.html?id=${p.id}"
                style="
                    display:block;
                    text-align:center;
                    padding:8px;
                    background:#111;
                    color:white;
                    border-radius:8px;
                    text-decoration:none;
                ">
                View detail →
                </a>
            </div>

        </div>
    `);
    infoWindow.open({map,anchor:marker});
}

function loadNearby(lat,lng){

    nearbyData=[];
    nearbyMarkers.forEach(m=>m.map=null);
    nearbyMarkers=[];

    const service=new google.maps.places.PlacesService(map);

    activeTypes.forEach(type=>{
        service.nearbySearch({
            location:{lat,lng},
            radius:500,
            type
        },(res,status)=>{
            if(status!=="OK") return;

            res.slice(0,3).forEach(p=>{
                p._type=type;
                nearbyData.push(p);
            });

            renderNearby(lat,lng);
        });
    });
}

function renderNearby(lat,lng){

    nearbyMarkers.forEach(m=>m.map=null);
    nearbyMarkers=[];

    nearbyData.forEach(p=>{

        const marker=new google.maps.marker.AdvancedMarkerElement({
            map,
            position:p.geometry.location,
            content:createNearbyMarker(p._type)
        });

        const dist = Math.round(
            google.maps.geometry.spherical.computeDistanceBetween(
                new google.maps.LatLng(lat,lng),
                p.geometry.location
            )
        );

        marker.addListener("click",()=>{
            infoWindow.setContent(`
                <div style="color:black;max-width:240px;font-family:Inter">

                    ${p.photos?.[0] ? `
                    <img src="${p.photos[0].getUrl({maxWidth:300})}" 
                         style="width:100%;height:140px;object-fit:cover;border-radius:10px;margin-bottom:8px;">
                    ` : ""}

                    <b style="font-size:15px;">${p.name}</b>

                    <div style="font-size:13px;opacity:0.7;margin-bottom:6px;">
                        ⭐ ${p.rating || "-"} • ${p._type}
                    </div>

                    <div style="font-size:13px;">
                        📍 ${dist} m away
                    </div>

                    <div style="margin-top:10px;">
                        <a target="_blank"
                        href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}"
                        style="
                            display:block;
                            text-align:center;
                            padding:6px;
                            background:#111;
                            color:white;
                            border-radius:8px;
                            text-decoration:none;
                        ">
                        View on Maps →
                        </a>
                    </div>

                </div>
            `);
            infoWindow.open({map,anchor:marker});
        });

        nearbyMarkers.push(marker);
    });
}

function toggleNav(){
    const menu = document.getElementById("nav-menu");
    menu.classList.toggle("show");
}

const debouncedNearbyReload =
    debounce(()=>{

        if(currentProperty){

            loadNearby(
                currentProperty.lat,
                currentProperty.lng
            );

        }

    }, 400);

function toggleType(t){
    activeTypes.includes(t)
    ? activeTypes = activeTypes.filter(x=>x!==t)
    : activeTypes.push(t);

    // highlight UI
    document.querySelectorAll(".nearby-filter button")
    .forEach(btn=>{
        const type = btn.innerText;
    });

    nearbyLoadedFor = null;

    debouncedNearbyReload();
}

function initFilters(){

    const countries = [...new Set(assets.map(p=>p.country).filter(Boolean))];
    const types = [...new Set(assets.map(p=>p.type).filter(Boolean))];

    // COUNTRY
    country.innerHTML = `<option value="">All Countries</option>` +
        countries.map(c=>`<option value="${c}">${c}</option>`).join("");

    // CITY (ban đầu = tất cả)
    updateCityOptions();

    // TYPE
    type.innerHTML = `<option value="">All Types</option>` +
        types.map(t=>`<option value="${t}">${t}</option>`).join("");
}

function updateCityOptions(){

    const selectedCountry = country.value;

    let cities;

    if(selectedCountry){
        cities = [...new Set(
            assets
            .filter(p => p.country === selectedCountry)
            .map(p => p.city)
            .filter(Boolean)
        )];
    } else {
        cities = [...new Set(
            assets.map(p => p.city).filter(Boolean)
        )];
    }

    city.innerHTML = `<option value="">All Cities</option>` +
        cities.map(c=>`<option value="${c}">${c}</option>`).join("");
}

function applyFilters(){

    let list = [...assets];

    const keyword = search.value.toLowerCase();
    const c = country.value;
    const cityVal = city.value;
    const t = type.value;

    if(keyword){
        list = list.filter(p =>
            p.name.toLowerCase().includes(keyword) ||
            (p.address||"").toLowerCase().includes(keyword)
        );
    }

    if(c){
        list = list.filter(p => p.country === c);
    }

    if(cityVal){
        list = list.filter(p => p.city === cityVal);
    }

    if(t){
        list = list.filter(p => 
            (p.type || "").toLowerCase() === t.toLowerCase()
        );
    }

    const minP = parseFloat(priceMin.value);
    const maxP = parseFloat(priceMax.value);

    if(!isNaN(minP)) list = list.filter(p => p.price >= minP);
    if(!isNaN(maxP)) list = list.filter(p => p.price <= maxP);

    const minR = parseFloat(rentMin.value);
    const maxR = parseFloat(rentMax.value);

    if(!isNaN(minR)) list = list.filter(p => p.rent >= minR);
    if(!isNaN(maxR)) list = list.filter(p => p.rent <= maxR);

    render(list);
    
    if(list.length){

        nearbyLoadedFor = null;

        focusProperty(list[0].id);

    }
}


</script>
