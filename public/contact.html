<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>

/* GLOBAL */
body {
    margin:0;
    font-family:Inter;
    background:#0b0f14;
    color:white;
}

.navbar {
    position:fixed;
    top:0;
    left:0;        
    right:0;      

    height:70px;

    display:flex;
    justify-content:flex-start;
    align-items:center;

    padding:0 40px;

    background:rgba(10,15,20,0.6);
    backdrop-filter:blur(12px);

    border-bottom:1px solid #222;

    box-sizing:border-box; 
}

.nav-left {
    display:flex;
    align-items:center;
    gap:30px;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:"Playfair Display", serif;
   
    font-weight:600;
    position:relative;

    font-size:20px;
    letter-spacing:2px;

    color:white;
    text-decoration:none;

    transition:
        color 0.35s ease,
        text-shadow 0.35s ease,
        transform 0.35s ease,
        filter 0.35s ease;

    z-index:1;
}

.logo::after{

    width:135%;
    height:160%;

    background:
        radial-gradient(
            circle,
            rgba(255,230,120,0.82) 0%,
            rgba(255,215,80,0.52) 20%,
            rgba(255,190,50,0.18) 46%,
            rgba(255,160,20,0.0) 72%
        );

    filter:blur(14px);
}

.logo:hover{

    color:#fff6dc;

    transform:translateY(-1px) scale(1.02);

    filter:brightness(1.08);

    text-shadow:
        0 0 4px rgba(255,240,180,0.85),
        0 0 10px rgba(255,225,120,0.65),
        0 0 22px rgba(255,210,90,0.42);
}

.logo:hover::after{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1.15);
}



.nav-link {
    font-family:'Playfair Display';
    font-size:15px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#ccc;
    text-decoration:none;
}

.nav-link:hover {
    opacity:1;
    color:#00ffd5;
}

.nav-link.active {
    color:#00ffd5;
}

/* CONTENT */
.container {
    margin-top:100px;
    display:flex;
    justify-content:center;
    padding:40px;
}

.contact-card {
    width:100%;
    max-width:600px;
    background:#111;
    border-radius:16px;
    padding:30px 35px;
    box-shadow:0 20px 50px rgba(0,0,0,0.6);
}

/* TITLE */
.contact-card h1 {
    font-family:'Playfair Display';
    margin-bottom:10px;
}

.contact-card p {
    color:#aaa;
    margin-bottom:20px;
}


/* INPUT */
input, textarea {
    width:100%;
    padding:12px;
    margin-bottom:14px;

    background:#0b0f14;
    border:1px solid #222;
    border-radius:10px;

    color:white;
    font-size:14px;

    box-sizing:border-box;

    margin-left:1px; 
}

input:focus, textarea:focus {
    outline:none;
    border-color:#00ffd5;
}

/* BUTTON */
button {
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;

    background:#00ffd5;
    color:black;
    font-weight:500;
    cursor:pointer;

    transition:0.2s;
}

button:hover {
    transform:translateY(-2px);
}

/* CONTACT INFO */
.info {
    margin-top:20px;
    font-size:13px;
    color:#aaa;
}

@media(max-width:768px){
    .navbar {
        padding:0 20px;
    }

    .nav-left {
        gap:12px;
        flex-wrap:wrap; /* 🔥 quan trọng */
    }

    .nav-link {
        font-size:11px;
    }
}

.contact-hero{
  min-height:60vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:120px 5vw 70px;

  background:
    linear-gradient(rgba(0,0,0,0.30), rgba(0,0,0,0.55)),
    url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?q=80&w=2070&auto=format&fit=crop');

  background-size:cover;
  background-position:center;
}


/* =========================
UNIFIED AUTH BUTTON
========================= */
#login-btn,
.login-btn,
.auth-user-btn{
  display:inline-flex !important;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:42px;
  padding:0 14px !important;
  border-radius:14px !important;
  border:1px solid rgba(255,255,255,0.16) !important;
  background:linear-gradient(135deg,rgba(255,255,255,0.11),rgba(255,255,255,0.045)) !important;
  color:white !important;
  cursor:pointer;
  font-family:Inter,Arial,sans-serif;
  font-size:12px !important;
  font-weight:800 !important;
  line-height:1;
  white-space:nowrap;
  width:auto !important;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.14),
    0 10px 26px rgba(0,0,0,0.26);
  transition:.25s ease;
}

#login-btn:hover,
.login-btn:hover,
.auth-user-btn:hover{
  transform:translateY(-1px);
  border-color:rgba(0,255,213,0.42) !important;
}

.auth-role-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  height:24px;
  padding:0 9px;
  border-radius:999px;
  background:#00ffd5;
  color:#041018;
  font-size:10px;
  font-weight:900;
  letter-spacing:.5px;
  text-transform:uppercase;
}

.auth-username{
  max-width:180px;
  overflow:hidden;
  text-overflow:ellipsis;
  color:white;
  opacity:.95;
}

.auth-logout-text{
  color:#cbd5e1;
  opacity:.9;
}

@media(max-width:768px){
  .auth-username{
    max-width:110px;
  }
}

</style>

</head>

<body>

<div class="container">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
emailjs.init("tk3k256P-tSD5IV0W"); 
</script>

<script>
function renderUnifiedAuthButton(userData={}){
  const btn =
    document.getElementById('login-btn');

  if(!btn){
    return;
  }

  btn.classList.add('auth-user-btn');

  if(!userData.loggedIn){

    btn.innerHTML = `
      <span class="auth-role-pill">LOGIN</span>
    `;

    return;
  }

  const role =
    String(userData.role || 'user').toLowerCase();

  const roleLabel =
    role === 'admin'
      ? 'Admin 👑'
      : role === 'vip'
        ? 'VIP 💎'
        : 'User';

  const username =
    userData.username ||
    userData.email ||
    'User';

  btn.innerHTML = `
    <span class="auth-role-pill">${roleLabel}</span>
    <span class="auth-username">${username}</span>
    <span class="auth-logout-text">(Logout)</span>
  `;
}
</script>

</body>

<script>
    const btn = document.querySelector("button");

    btn.onclick = async () => {

        const nameInput = document.querySelector('input[placeholder="Your Name"]');
        const emailInput = document.querySelector('input[placeholder="Email"]');
        const phoneInput = document.querySelector('input[placeholder="Phone Number"]');
        const messageInput = document.querySelector('textarea');

        const name = nameInput.value;
        const email = emailInput.value;
        const phone = phoneInput.value;
        const message = messageInput.value;

        if(!name || !email || !phone || !message){
            alert("Please fill all fields");
            return;
        }

        btn.innerText = "Sending...";
        btn.disabled = true;

        try {
            await emailjs.send(
                "service_4uxcigl",
                "template_czyk2u6",
                {
                    name,
                    email,
                    phone,
                    message
                }
            );

            nameInput.value = "";
            emailInput.value = "";
            phoneInput.value = "";
            messageInput.value = "";

            btn.innerText = "Sent!";
            setTimeout(()=>{
                btn.innerText = "Send Message";
                btn.disabled = false;
            }, 1000);

        } catch(err){
            console.error(err);
            btn.innerText = "Send Failed";
            btn.disabled = false;
        }
    };
</script>
