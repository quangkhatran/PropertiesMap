<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;500&display=swap" rel="stylesheet">

<style>

/* GLOBAL */
body {
    margin:0;
    font-family:Inter;
    background:#0b0f14;
    color:white;
}

.navbar {
    position:fixed;
    top:0;
    left:0;        
    right:0;      

    height:70px;

    display:flex;
    justify-content:flex-start;
    align-items:center;

    padding:0 40px;

    background:rgba(10,15,20,0.6);
    backdrop-filter:blur(12px);

    border-bottom:1px solid #222;

    box-sizing:border-box; 
}

.nav-left {
    display:flex;
    align-items:center;
    gap:30px;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:"Playfair Display", serif;
   
    font-weight:600;
    position:relative;

    font-size:20px;
    letter-spacing:2px;

    color:white;
    text-decoration:none;

    transition:
        color 0.35s ease,
        text-shadow 0.35s ease,
        transform 0.35s ease,
        filter 0.35s ease;

    z-index:1;
}

.logo::after{

    width:135%;
    height:160%;

    background:
        radial-gradient(
            circle,
            rgba(255,230,120,0.82) 0%,
            rgba(255,215,80,0.52) 20%,
            rgba(255,190,50,0.18) 46%,
            rgba(255,160,20,0.0) 72%
        );

    filter:blur(14px);
}

.logo:hover{

    color:#fff6dc;

    transform:translateY(-1px) scale(1.02);

    filter:brightness(1.08);

    text-shadow:
        0 0 4px rgba(255,240,180,0.85),
        0 0 10px rgba(255,225,120,0.65),
        0 0 22px rgba(255,210,90,0.42);
}

.logo:hover::after{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1.15);
}



.nav-link {
    font-family:'Playfair Display';
    font-size:15px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#ccc;
    text-decoration:none;
}

.nav-link:hover {
    opacity:1;
    color:#00ffd5;
}

.nav-link.active {
    color:#00ffd5;
}

/* CONTENT */
.container {
    margin-top:100px;
    display:flex;
    justify-content:center;
    padding:40px;
}

.contact-card {
    width:100%;
    max-width:600px;
    background:#111;
    border-radius:16px;
    padding:30px 35px;
    box-shadow:0 20px 50px rgba(0,0,0,0.6);
}

/* TITLE */
.contact-card h1 {
    font-family:'Playfair Display';
    margin-bottom:10px;
}

.contact-card p {
    color:#aaa;
    margin-bottom:20px;
}


/* INPUT */
input, textarea {
    width:100%;
    padding:12px;
    margin-bottom:14px;

    background:#0b0f14;
    border:1px solid #222;
    border-radius:10px;

    color:white;
    font-size:14px;

    box-sizing:border-box;

    margin-left:1px; 
}

input:focus, textarea:focus {
    outline:none;
    border-color:#00ffd5;
}

/* BUTTON */
button {
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;

    background:#00ffd5;
    color:black;
    font-weight:500;
    cursor:pointer;

    transition:0.2s;
}

button:hover {
    transform:translateY(-2px);
}

/* CONTACT INFO */
.info {
    margin-top:20px;
    font-size:13px;
    color:#aaa;
}

@media(max-width:768px){
    .navbar {
        padding:0 20px;
    }

    .nav-left {
        gap:12px;
        flex-wrap:wrap; /* 🔥 quan trọng */
    }

    .nav-link {
        font-size:11px;
    }
}

.contact-hero{
  min-height:60vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:120px 5vw 70px;

  background:
    linear-gradient(rgba(0,0,0,0.30), rgba(0,0,0,0.55)),
    url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?q=80&w=2070&auto=format&fit=crop');

  background-size:cover;
  background-position:center;
}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <div class="nav-left">
        <a href="index.html" class="logo">KHA TRAN</a>

        <a href="index.html#home" class="nav-link">Home</a>
        <a href="lifestyle.html" class="nav-link">Lifestyle</a>
        <a href="real-estate.html" class="nav-link">Real Estate</a>
        <a href="compare.html" class="nav-link">Compare</a>
        <a href="contact.html" class="nav-link active">Contact</a>
    </div>

</div>

<section class="contact-hero">
  <div class="contact-card">
    <h1>Contact</h1>
    <p>Please leave your info and we will contact you shortly</p>

    <input placeholder="Your Name">
    <input placeholder="Email">
    <input type="tel" placeholder="Phone Number">
    <textarea rows="5" placeholder="Message"></textarea>  
    <button>Send Message</button>
    
    <div class="info">
        📞 0702106868 <br>
        📧 quangkhatran@gmail.com
    </div>
</div>
</section>

<div class="container">





</div>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
emailjs.init("tk3k256P-tSD5IV0W"); 
</script>
</body>

<script>
    const btn = document.querySelector("button");

    btn.onclick = async () => {

        const nameInput = document.querySelector('input[placeholder="Your Name"]');
        const emailInput = document.querySelector('input[placeholder="Email"]');
        const phoneInput = document.querySelector('input[placeholder="Phone Number"]');
        const messageInput = document.querySelector('textarea');

        const name = nameInput.value;
        const email = emailInput.value;
        const phone = phoneInput.value;
        const message = messageInput.value;

        if(!name || !email || !phone || !message){
            alert("Please fill all fields");
            return;
        }

        btn.innerText = "Sending...";
        btn.disabled = true;

        try {
            await emailjs.send(
                "service_4uxcigl",
                "template_czyk2u6",
                {
                    name,
                    email,
                    phone,
                    message
                }
            );

            nameInput.value = "";
            emailInput.value = "";
            phoneInput.value = "";
            messageInput.value = "";

            btn.innerText = "Sent!";
            setTimeout(()=>{
                btn.innerText = "Send Message";
                btn.disabled = false;
            }, 1000);

        } catch(err){
            console.error(err);
            btn.innerText = "Send Failed";
            btn.disabled = false;
        }
    };
</script>
</html>
