<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

    import { 
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    
    import { 
      getFirestore,
      doc,
      getDoc,
      setDoc,
      serverTimestamp,
      collection,
      onSnapshot,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyBsUBX4UQSYDJ6PlntatrXutktM-TevIPs",
      authDomain: "propertiesmap-b304e.firebaseapp.com",
      projectId: "propertiesmap-b304e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    window.userRole = "guest";

    // expose ra ngoài
    window.auth = auth;
    window.signInWithEmailAndPassword = signInWithEmailAndPassword;
    window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
    window.signOut = signOut;

    window.isLoggedIn = false;

    window.openLogin = function(){
        document.getElementById("login-modal").style.display = "flex";

        document.getElementById("email").value = "";
        document.getElementById("password").value = "";
    }

    window.login = function(){
        const email = document.getElementById("email").value;
        const pass = document.getElementById("password").value;

        signInWithEmailAndPassword(auth, email, pass)
        .then(()=>{
            document.getElementById("login-modal").style.display = "none";     
        })
        .catch(err=>alert(err.message));
    }

    window.register = async function(){
        const email = document.getElementById("email").value;
        const pass = document.getElementById("password").value;

        try{
            const cred = await createUserWithEmailAndPassword(auth, email, pass);

            await setDoc(doc(db, "users", email.toLowerCase()), {
                email: email.toLowerCase(),
                role: "user",
                status: "pending",   
                createdAt: serverTimestamp()
            }, {merge: true});

            alert("Registered successfully. Please wait for admin's approval.");
            document.getElementById("login-modal").style.display = "none";

        }catch(e){
            alert(e.message);
        }
    }

    window.logout = function(){
        signOut(auth).then(()=>{
            window.userRole = "guest";
            window.userStatus = "guest";
            updateNavbar(null);
            updatePriceUI();
            updatePopup();
        });
    }

    window.isLoggedIn = false;

    window.userRole = "guest";
    window.userStatus = "guest";

    onAuthStateChanged(auth, async (user)=>{
        window.isLoggedIn = !!user;

        if(user){
            const ref = doc(db, "users", user.email.toLowerCase());
            const snap = await getDoc(ref);

            if(snap.exists()){
                const data = snap.data();
                window.userRole = data.role;
                window.userStatus = data.status;
            }else{
                window.userRole = "user";
                window.userStatus = "pending";
            }

        }else{
            window.userRole = "guest";
            window.userStatus = "guest";
        }

        // 🔥 UPDATE UI TRƯỚC
        updateNavbar(user);
        updatePriceUI();
        updatePopup();

    });

    function updateNavbar(user){
        const btn = document.getElementById("login-btn");

        if(!btn) return;

        if(user){

            const role =
                window.userRole || "user";

            const email =
                user.email || "User";

            renderUnifiedAuthButton({
                loggedIn:true,
                role:role,
                email:email,
                username:email
            });

            btn.onclick = logout;

        }else{

            renderUnifiedAuthButton({
                loggedIn:false
            });

            btn.onclick = openLogin;
        }
    }

    function updatePriceUI(){
        if(typeof renderProject === "function"){
            renderProject();
        }
    }

    function updatePopup(){
        if(!map) return;

        if(window.infoWindow && window.mainMarker && window.map){
            infoWindow.setContent(getPopupContent());
        }
    }
</script>

                </div>

            </div>
        ` : ""}

    <img src="${i}" onclick="openLightbox(${index})">

    document.getElementById("property-field").value = project.name;
}

<div id="lightbox" class="lightbox">

    <div class="lightbox-top">
        <span onclick="closeLightbox()">✕</span>
    </div>

    <div class="lightbox-main">

        <div class="nav prev" onclick="changeSlide(-1)">‹</div>

        <img id="lightbox-img">

        <div class="nav next" onclick="changeSlide(1)">›</div>

    </div>

    <div id="thumbs" class="thumbs"></div>

</div>

<script>
    let currentIndex = 0;

    function openLightbox(index){
        currentIndex = index;
        document.getElementById("lightbox").style.display = "flex";
        renderLightbox();
    }

    function closeLightbox(){
        document.getElementById("lightbox").style.display = "none";
    }

    function changeSlide(dir){
        currentIndex += dir;

        if(currentIndex < 0) currentIndex = project.images.length - 1;
        if(currentIndex >= project.images.length) currentIndex = 0;

        renderLightbox();
    }

    function renderLightbox(){

        const img = document.getElementById("lightbox-img");
        img.src = project.images[currentIndex];

        const thumbs = document.getElementById("thumbs");

        thumbs.innerHTML = project.images.map((src,i)=>`
            <img src="${src}" 
                 class="${i===currentIndex?'active':''}"
                 onclick="openLightbox(${i})">
        `).join("");
    }

    let startX = 0;

    document.getElementById("lightbox").addEventListener("touchstart", e=>{
        startX = e.touches[0].clientX;
    });

    document.getElementById("lightbox").addEventListener("touchend", e=>{
        let endX = e.changedTouches[0].clientX;

        if(endX - startX > 50) changeSlide(-1);
        if(startX - endX > 50) changeSlide(1);
    });

    document.addEventListener("keydown", e=>{
        if(document.getElementById("lightbox").style.display !== "flex") return;

        if(e.key === "ArrowRight") changeSlide(1);
        if(e.key === "ArrowLeft") changeSlide(-1);
        if(e.key === "Escape") closeLightbox();
    });

    const imgEl = document.getElementById("lightbox-img");
    if(imgEl){
        imgEl.addEventListener("click", ()=>{
            imgEl.style.transform =
                imgEl.style.transform === "scale(2)" ? "scale(1)" : "scale(2)";
        });
    }

    function switchLang(lang, event){

        document
            .querySelectorAll(".description-content")
            .forEach(el=>el.classList.remove("active"));

        document
            .querySelectorAll(".lang-btn")
            .forEach(el=>el.classList.remove("active"));

        document
            .getElementById(`desc-${lang}`)
            .classList.add("active");

        event.target.classList.add("active");
    }

    function handleModalClick(e){
        if(e.target.id === "login-modal"){
            document.getElementById("login-modal").style.display = "none";
        }
    }

    document.addEventListener("keydown", (e)=>{
        if(e.key === "Escape"){
            document.getElementById("login-modal").style.display = "none";
        }
    });
</script>

<script>
function renderUnifiedAuthButton(userData={}){
  const btn =
    document.getElementById('login-btn');

  if(!btn){
    return;
  }

  btn.classList.add('auth-user-btn');

  if(!userData.loggedIn){

    btn.innerHTML = `
      <span class="auth-role-pill">LOGIN</span>
    `;

    return;
  }

  const role =
    String(userData.role || 'user').toLowerCase();

  const roleLabel =
    role === 'admin'
      ? 'Admin 👑'
      : role === 'vip'
        ? 'VIP 💎'
        : 'User';

  const username =
    userData.username ||
    userData.email ||
    'User';

  btn.innerHTML = `
    <span class="auth-role-pill">${roleLabel}</span>
    <span class="auth-username">${username}</span>
    <span class="auth-logout-text">(Logout)</span>
  `;
}
</script>
